<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="assets/banner.jpg" alt="Banner Image" class="banner" />
  </header>

  <main>
    <section class="media-section">
      <h2>Graphic</h2>
      <div class="scroll-box">
        <img src="assets/graphic1.jpg" alt="Graphic 1" />
        <img src="assets/graphic2.jpg" alt="Graphic 2" />
      </div>
      <p class="description">Description for Graphic section.</p>
    </section>

    <section class="media-section">
      <h2>Video</h2>
      <div class="scroll-box">
        <video src="assets/video1.mp4" controls></video>
        <video src="assets/video2.mp4" controls></video>
      </div>
      <p class="description">Description for Video section.</p>
    </section>

    <section class="media-section">
      <h2>Community</h2>
      <div class="scroll-box">
        <img src="assets/community1.jpg" alt="Community 1" />
        <img src="assets/community2.jpg" alt="Community 2" />
      </div>
      <p class="description">Description for Community section.</p>
    </section>
  </main>
</body>
</html>
